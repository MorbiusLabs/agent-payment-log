name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Python 3.9 builds are not published for Ubuntu 26.04, so test it on 24.04
          - os: ubuntu-24.04
            python: "3.9"
          # macOS arm64 runners are often out of capacity, the Intel image is not
          - os: macos-15-intel
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install and run the command line
        shell: bash
        run: |
          python -m pip install .
          python examples/demo.py
          agent-payment-log verify demo_payments.jsonl
          agent-payment-log show demo_payments.jsonl
          if agent-payment-log verify demo_payments_tampered.jsonl; then
            echo "tampered log passed verification"; exit 1
          fi
